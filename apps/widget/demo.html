<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget demo</title>
    <style>
      body { font: 16px/1.6 system-ui, sans-serif; max-width: 720px; margin: 48px auto; padding: 0 16px; color: #1e293b; }
      code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Bright Smile Dental</h1>
    <p>This page stands in for a customer's website. The chat bubble in the corner is the embedded widget.</p>
    <p>Open with <code>?key=pk_…&amp;api=http://localhost:4000</code> (get the key from <code>npm run db:seed</code> or the dashboard).</p>
    <script>
      const params = new URLSearchParams(location.search);
      const s = document.createElement('script');
      s.src = (params.get('api') || 'http://localhost:4000') + '/widget.js';
      s.dataset.key = params.get('key') || '';
      s.async = true;
      document.body.appendChild(s);
    </script>
  </body>
</html>

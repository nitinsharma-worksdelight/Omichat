<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Chat demo</title>
    <!--
      The demo page moved to the API's address (/demo?key=pk_…), away from the dashboard where the login is kept. This
      page only forwards old links there, key included. It loads no chat and shows nothing from the business.
    -->
    <script>
      (function () {
        var local = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1;
        location.replace((local ? 'http://localhost:4000' : 'https://omichat-api.onrender.com') + '/demo' + location.search);
      })();
    </script>
  </head>
  <body>
    <p>The chat demo has moved to <a href="https://omichat-api.onrender.com/demo">its new address</a>.</p>
  </body>
</html>

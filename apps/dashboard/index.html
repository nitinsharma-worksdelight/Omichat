<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Pick the theme before the first paint: the choice stored in this browser, else the device's setting.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('omni:theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme);
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231A1917'/%3E%3Cpath d='M16 8.5a7.5 7.5 0 0 1 7.5 7.5' fill='none' stroke='%23A898FF' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M23.5 16a7.5 7.5 0 0 1-7.5 7.5H9.6l1.7-2.4A7.5 7.5 0 0 1 16 8.5' fill='none' stroke='%233CC2BF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Omni AI · Dashboard</title>

</html>

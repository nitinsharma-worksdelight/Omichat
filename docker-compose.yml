# Production-like local stack: Postgres + pgvector, Redis, API and a separate worker.
# (Day-to-day development doesn't need this: `npm run dev` runs on embedded Postgres with in-process queues.)
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
      POSTGRES_DB: omni
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  api:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    env_file: [apps/server/.env]
    environment:
      DATABASE_URL: postgresql://omni:omni@postgres:5432/omni
      REDIS_URL: redis://redis:6379
      RUN_WORKERS_IN_API: "false"
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["node", "dist/worker.js"]
    env_file: [apps/server/.env]
    environment:
      DATABASE_URL: postgresql://omni:omni@postgres:5432/omni
      REDIS_URL: redis://redis:6379
      AUTO_MIGRATE: "false"
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
